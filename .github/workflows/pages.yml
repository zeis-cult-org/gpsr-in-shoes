# Pubblica la sola cartella public/ su GitHub Pages.
# Non fa nulla finché il repository non è su GitHub e Pages non è attivato
# con sorgente "GitHub Actions" (vedi docs/PUBBLICAZIONE.md).
# Permessi: il minimo richiesto da deploy-pages (pages + id-token) più la sola lettura del codice.
name: Pubblica snodo GPSR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Controlli minimi prima della pubblicazione
        run: |
          test -f public/index.html
          # Impronta della pagina approvata: una modifica non autorizzata blocca la pubblicazione.
          # Se una nuova versione viene approvata, aggiornare qui e in scripts/verifica.ps1.
          echo "31fd181b644cfd32f92359a367611751  public/index.html" | md5sum -c -
          grep -qF '<h1>GPSR - Sicurezza dei prodotti.<br>Informazioni sempre accessibili.</h1>' public/index.html
          for u in https://www.cultofficial.com/pages/gpsr https://www.docksteps.com/pages/gpsr https://www.oxs-shoes.it/pages/gpsr; do
            grep -qF "href=\"$u\"" public/index.html
          done

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v5

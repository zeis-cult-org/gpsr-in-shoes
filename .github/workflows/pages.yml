# Pubblica la sola cartella public/ su GitHub Pages.
# Non fa nulla finché il repository non è sul GitHub dell'organizzazione aziendale
# e Pages non è attivato con sorgente "GitHub Actions" (vedi docs/PUBBLICAZIONE.md).
name: Pubblica snodo GPSR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Controlli minimi prima della pubblicazione
        run: |
          test -f public/index.html
          grep -qF '<h1>GPSR - Sicurezza dei prodotti.<br>Informazioni sempre accessibili.</h1>' public/index.html
          for u in https://www.cultofficial.com/pages/gpsr https://www.docksteps.com/pages/gpsr https://www.oxs-shoes.it/pages/gpsr; do
            grep -qF "href=\"$u\"" public/index.html
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
